name: CI

on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Keep the downloaded Mongo binary somewhere the cache can reach.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Taken from the packageManager field in package.json.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Without this the suite re-downloads ~80MB of mongod on every run.
      - name: Cache the in-memory Mongo binary
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-7.0

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Smoke tests
        run: pnpm test

      # Catches drift between the zod schemas and the committed spec the
      # frontend generates its types from.
      - name: Check the committed OpenAPI spec is current
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/unused
          JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-to-pass
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-to-pass
          HOST: http://localhost:5000
          SITE_NAME: Aide-memoire
          FRONT_END_LOCATION: http://localhost:3000
          EMAIL_ADDRESS: ci@example.com
          EMAIL_NAME: CI
        run: |
          pnpm exec tsx src/openapi/generate.ts
          if ! git diff --exit-code --stat openapi.json; then
            echo "::error::openapi.json is out of date. Run 'pnpm openapi' and commit the result."
            exit 1
          fi

  image:
    name: Build the container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Not pushed yet — a registry and its credentials are the remaining
          # piece of the deploy story. Building here still proves the
          # Dockerfile works on every change.
          push: false
          load: true
          tags: aide-memoire-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the image starts and answers its healthcheck
        run: |
          docker run -d --name api-smoke \
            -e NODE_ENV=production \
            -e PORT=5000 \
            -e MONGODB_URL='mongodb://127.0.0.1:27017/unreachable' \
            -e JWT_ACCESS_SECRET='ci-access-secret-that-is-long-enough-to-pass' \
            -e JWT_REFRESH_SECRET='ci-refresh-secret-that-is-long-enough-to-pass' \
            -e HOST='http://localhost:5000' \
            -e SITE_NAME='Aide-memoire' \
            -e FRONT_END_LOCATION='http://localhost:3000' \
            -e EMAIL_ADDRESS='ci@example.com' \
            -e EMAIL_NAME='CI' \
            aide-memoire-api:${{ github.sha }} || true

          # The API deliberately refuses to listen without a reachable
          # database (S2-12), so this asserts that failure mode rather than a
          # successful boot: the container must exit non-zero, not hang.
          sleep 20
          STATUS=$(docker inspect --format '{{.State.Status}}' api-smoke)
          echo "container status: $STATUS"
          docker logs api-smoke 2>&1 | tail -20
          if [ "$STATUS" = "running" ]; then
            echo "::error::container is listening despite an unreachable database"
            exit 1
          fi
