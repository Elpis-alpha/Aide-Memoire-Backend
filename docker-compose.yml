# Mongo is Atlas — deliberately no database service here, so there is no
# volume to back up and no replica set to maintain on the VPS.
#
# Every name below is explicit. Compose otherwise derives the project name from
# the directory, which here is "back-end" — generic enough to collide with any
# other project on a shared VPS, and it namespaces the containers, the network
# and the redis volume. An accidental collision on the volume is the dangerous
# one: two projects would share one redis append-only file.
name: aide-memoire

services:
  api:
    build: .
    image: aide-memoire-api:latest
    container_name: aide-memoire-api
    restart: unless-stopped
    # No published port. The reverse proxy is itself a container on the shared
    # `overseer-edge` network and reaches this one directly, so there is nothing
    # for the host to forward and nothing bound on the host at all.
    #
    # Point the proxy at `aide-memoire-api:5000` — the CONTAINER name, which is
    # unique across the box. Compose also adds the *service* name as an alias on
    # every network this joins, so `api` resolves here too; on a network shared
    # with other projects that alias is almost certainly not unique, and Docker
    # round-robins between every container claiming it.
    expose:
      - "5000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # nginx forwards X-Forwarded-For, so the rate limiter sees real client
      # IPs rather than the proxy's.
      TRUST_PROXY: "1"
      # Resolved over the project network by service name, not via the host, so
      # this keeps working with no published redis port.
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      # Reaches redis here; redis is on this network only.
      internal:
      # Reachable by the proxy here. The explicit alias is what the proxy should
      # use, and it keeps working if container_name is ever dropped.
      overseer-edge:
        aliases:
          - aide-memoire-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Long enough for the 10s in-flight drain in src/index.ts to finish.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: aide-memoire-redis
    restart: unless-stopped
    # Refresh-token store and rate-limit counters.
    #
    # Deliberately NOT published to the host. Only `api` talks to it, over the
    # project network. Publishing 127.0.0.1:6379 would fail to start the stack
    # outright if anything else on the VPS — another project, or a system redis
    # — already holds that port, and it would expose this instance to every
    # other process on the box for no gain. Reach it for debugging with
    # `docker compose exec redis redis-cli` instead.
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      # Internal only, deliberately NOT on overseer-edge — otherwise every
      # project sharing that network could reach the refresh-token store.
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    name: aide-memoire-internal

  # The shared reverse-proxy network. Created and owned outside this project —
  # `docker network create overseer-edge` — so Compose must not try to make it.
  # `up` fails with a clear error if it does not exist.
  overseer-edge:
    external: true
    name: overseer-edge

volumes:
  redis-data:
    # Explicit, so it is never "back-end_redis-data" and never shared with
    # another project's redis by accident.
    name: aide-memoire-redis-data
