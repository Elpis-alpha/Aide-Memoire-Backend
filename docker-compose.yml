# Mongo is Atlas — deliberately no database service here, so there is no
# volume to back up and no replica set to maintain on the VPS.

services:
  api:
    build: .
    image: aide-memoire-api:latest
    restart: unless-stopped
    # Bound to loopback only. nginx on the host terminates TLS and proxies
    # to 5004; the container never has a publicly reachable port.
    ports:
      - "127.0.0.1:5004:5000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # nginx forwards X-Forwarded-For, so the rate limiter sees real client
      # IPs rather than the proxy's.
      TRUST_PROXY: "1"
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Long enough for the 10s in-flight drain in src/index.ts to finish.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Refresh-token store and rate-limit counters. Loopback only.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
